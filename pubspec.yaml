name: cotizador_app
description: "Cotizador multiplataforma (Android y Web) con Flutter, Firebase Firestore y exportación a PDF."
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.47.x incluye Dart 3.13.x.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1

  # Documentos PDF
  pdf: 3.13.1
  printing: 5.15.1

  # Iconografía estándar de iOS/Cupertino usada por widgets adaptativos.
  cupertino_icons: 1.0.8

  # Fechas y moneda
  intl: 0.20.3

  # Selección de imágenes para los productos del panel de administración.
  image_picker: ^1.2.4

  # Abre el cliente de correo del dispositivo para enviar la invitación al
  # personal agregado.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
